<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архив существ — Сапфировая таверна</title>
<style>
:root{--bg:#101723;--surface:#172333;--surface2:#1d2c40;--line:#2c4059;--text:#edf4ff;--muted:#8fa6c1;--blue:#62b7ff;--blue2:#2f78b6;--gold:#e7bc67;--green:#7fe0aa;--danger:#ff8191;--r:14px;--shadow:0 18px 45px #07101acc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 500px at 75% -10%,#244b70 0%,transparent 65%),var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:9px 13px;transition:.16s}button:hover{border-color:var(--blue);background:#25415d}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{height:76px;padding:0 34px;border-bottom:1px solid #24364b;background:#101a28dd;backdrop-filter:blur(16px);display:flex;align-items:center;gap:28px}.brand{display:flex;gap:12px;align-items:center;min-width:255px}.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#7ed4ff,#22659d);display:grid;place-items:center;color:#071526;font-weight:900;box-shadow:0 5px 20px #368dc466}.brand h1{font-size:17px;line-height:1.1;margin:0}.brand small{color:var(--muted);font-size:11px}.top-actions{margin-left:auto;display:flex;gap:9px}.primary{background:linear-gradient(135deg,#4aa5e9,#25669c);border-color:#6ac3ff;font-weight:700}.ghost{background:transparent}.layout{display:grid;grid-template-columns:275px minmax(390px,1fr) 400px;min-height:calc(100vh - 76px)}.sidebar{border-right:1px solid #24364b;padding:25px 18px;background:#111c2add}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.sidebar h2{font-size:20px;margin:7px 0 20px}.search{position:relative;margin-bottom:15px}.search input{width:100%;padding:11px 12px 11px 35px;background:#0e1825;border:1px solid var(--line);border-radius:9px}.search span{position:absolute;left:12px;top:9px;color:var(--muted)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:19px}.filter{padding:6px 9px;font-size:12px;background:transparent;color:var(--muted)}.filter.active{color:#fff;border-color:var(--blue);background:#244a6a}.card-list{display:flex;flex-direction:column;gap:7px;overflow:auto;max-height:calc(100vh - 270px);padding-right:3px}.list-card{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;text-align:left;padding:7px;border-color:transparent;background:transparent}.list-card:hover,.list-card.active{background:#20344a;border-color:#375779}.thumb{width:42px;height:52px;border-radius:7px;object-fit:cover;background:linear-gradient(145deg,#304d68,#152336);border:1px solid #496987}.list-card strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-card small{display:block;color:var(--muted);font-size:11px}.tier-dot{color:var(--gold);font-weight:800;font-size:12px}.workspace{padding:30px 34px;min-width:0}.workspace-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:23px}.workspace h2{font-size:28px;line-height:1.1;margin:6px 0 0}.count{color:var(--muted)}.preview{max-width:500px;margin:auto}.card-preview{position:relative;aspect-ratio:.76;border-radius:20px;border:1px solid #486b8b;background:linear-gradient(145deg,#27435d,#162334 65%);overflow:hidden;box-shadow:var(--shadow)}.card-preview img{width:100%;height:60%;object-fit:cover;display:block;filter:saturate(.9)}.card-preview .art-fallback{height:60%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#427aa0,#16283d 68%);font-size:68px;color:#a8d8ee}.card-overlay{position:absolute;left:15px;right:15px;top:15px;display:flex;justify-content:space-between;align-items:center}.tier-badge{background:#0c1827dd;border:1px solid #89b8d8;border-radius:7px;padding:3px 8px;color:#dff4ff;font-weight:800}.rarity{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.card-body{position:absolute;left:0;right:0;bottom:0;padding:14px 17px 18px;background:linear-gradient(transparent,#142235 16%)}.card-body h3{margin:0 0 8px;font-size:22px}.stats{display:flex;gap:8px;margin-bottom:10px}.stat{border-radius:8px;padding:4px 10px;font-weight:800;font-size:16px}.attack{background:#32526f;color:#7bd0ff}.health{background:#543c4d;color:#ff9db1}.card-body p{margin:0;color:#c8d7e5;font-size:13px;min-height:38px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.tag{font-size:11px;padding:3px 7px;border-radius:20px;background:#263f55;color:#9ed7f6}.editor{border-left:1px solid #24364b;background:#131f2e;padding:28px 25px;overflow:auto}.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.editor h2{margin:0;font-size:20px}.icon-btn{padding:7px 10px;color:var(--muted)}.form{display:grid;gap:15px}.field{display:grid;gap:6px}.field label{color:#b6c9dc;font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;background:#0d1825;border:1px solid var(--line);border-radius:9px;padding:10px 11px}.field textarea{min-height:94px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.image-tools{display:flex;gap:8px}.image-tools button{flex:1;font-size:12px}.file-label{display:block;text-align:center;padding:9px 12px;border:1px dashed #4f718f;border-radius:9px;color:#acd8f3;background:#172b40;cursor:pointer}.file-label:hover{border-color:var(--blue)}.file-label input{display:none}.savebar{display:flex;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}.savebar button{flex:1}.hint{font-size:11px;color:var(--muted);margin-top:10px}.toast{position:fixed;right:24px;bottom:24px;background:#234b3b;border:1px solid #64c894;color:#dcffeb;border-radius:10px;padding:11px 15px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.layout{grid-template-columns:235px 1fr}.editor{grid-column:1/-1;border:0;border-top:1px solid #24364b}.editor .form{max-width:700px}.preview{max-width:430px}}@media(max-width:700px){.topbar{padding:0 16px}.top-actions button:not(.primary){display:none}.layout{display:block}.sidebar{border:0;border-bottom:1px solid #24364b}.card-list{max-height:270px}.workspace{padding:22px 16px}.editor{padding:23px 16px}.workspace h2{font-size:23px}}.keyword-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.keyword-grid label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#17283a;border-radius:8px;padding:8px 7px;color:#bdd0e2;font-size:12px;cursor:pointer}.keyword-grid label:has(input:checked){border-color:#6dbce9;background:#21445e;color:#f2fbff;box-shadow:inset 0 0 0 1px #6dbce955}.keyword-grid input{accent-color:#58b8f4}.type-tools{display:flex;gap:7px;margin-top:7px}.type-tools input{min-width:0;flex:1;background:#0d1825;border:1px solid var(--line);border-radius:8px;padding:8px}.type-tools button{padding:8px 10px;font-size:12px}.ability-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:7px;background:#243f55;border:1px solid #3c6681;color:#d8f1ff;font-size:11px;font-weight:700}.ability-badge.poisonous{color:#c9f09b}.ability-badge.windfury{color:#a9e6ff}.ability-badge.divine_shield{color:#ffe49a}.ability-badge.stealth{color:#d3c1ff}.ability-badge.reborn{color:#a9f0ca}.ability-badge.taunt{color:#ffb2a3}
</style>
</head>
<body><div class="app"><header class="topbar"><div class="brand"><div class="mark">✦</div><div><h1>Сапфировая таверна</h1><small>Редактор существ</small></div></div><div class="top-actions"><button class="ghost" id="importBtn">Импорт JSON</button><button class="ghost" id="exportBtn">Экспорт JSON</button><button class="primary" id="newBtn">＋ Новое существо</button><input id="jsonFile" type="file" accept=".json,application/json" hidden></div></header><div class="layout"><aside class="sidebar"><span class="eyebrow">Коллекция</span><h2>Мои существа</h2><div class="search"><span>⌕</span><input id="search" placeholder="Найти по имени..." aria-label="Поиск"></div><div class="filters" id="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="beast">Звери</button><button class="filter" data-filter="pirate">Пираты</button><button class="filter" data-filter="custom">Свои</button></div><div class="card-list" id="cardList"></div></aside><main class="workspace"><div class="workspace-head"><div><span class="eyebrow">Предпросмотр карты</span><h2 id="workspaceTitle">Альфа-волк</h2></div><span class="count" id="count">0 карт</span></div><div class="preview"><div class="card-preview" id="preview"></div></div></main><aside class="editor"><div class="editor-head"><h2>Параметры существа</h2><button class="icon-btn" id="deleteBtn" title="Удалить карту">Удалить</button></div><form class="form" id="form"><div class="field"><label for="name">Название</label><input id="name" required placeholder="Например, Лунный бард"></div><div class="row"><div class="field"><label for="archetype">Тип существа</label><select id="archetype"></select><div class="type-tools"><input id="newType" placeholder="Новый тип, например Мех"><button type="button" id="addType">Добавить</button></div></div><div class="field"><label for="tier">Тир таверны</label><select id="tier"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div></div><div class="row"><div class="field"><label for="attack">Атака</label><input id="attack" type="number" min="0" max="99"></div><div class="field"><label for="health">Здоровье</label><input id="health" type="number" min="1" max="99"></div></div><div class="field"><label for="text">Описание способности</label><textarea id="text" placeholder="Боевой клич: ..."></textarea></div><div class="field"><label>Свойства карты</label><div class="keyword-grid" id="keywordGrid"><label><input type="checkbox" value="poisonous"> <span>☠ Яд</span></label><label><input type="checkbox" value="windfury"> <span>≋ Неистовые ветра</span></label><label><input type="checkbox" value="divine_shield"> <span>✦ Божественный щит</span></label><label><input type="checkbox" value="stealth"> <span>◌ Маскировка</span></label><label><input type="checkbox" value="reborn"> <span>↻ Перерождение</span></label><label><input type="checkbox" value="taunt"> <span>🛡 Провокация</span></label></div><input id="keywords" placeholder="Другие ключевые слова через запятую"><div class="hint">Отмеченные свойства автоматически появятся на карточке.</div></div><div class="field"><label>Изображение</label><div class="image-tools"><label class="file-label">Загрузить файл<input id="imageFile" type="file" accept="image/*"></label><button type="button" id="clearImage">Убрать</button></div><select id="assetSelect" aria-label="Выбрать готовое изображение"><option value="">Выбрать из папки проекта...</option></select></div><div class="savebar"><button type="submit" class="primary">Сохранить изменения</button><button type="button" id="duplicateBtn">Дублировать</button></div><div class="hint">Автосохранение в браузере включено. Экспортируйте JSON, чтобы сохранить файл рядом с проектом.</div></form></aside></div></div><div class="toast" id="toast"></div>
<script>
const assets=['alpha_wolf','arctic_fox','honey_badger','mongoose','blood_hyena','cave_toad','crocodile','giant_beetle','blood_moon_fox','ghost_lynx','giant_hornet','scorpion','gorilla','gryphon','octopus','trapdoor_spider','basilisk','coral_serpent','thunderbird','velociraptor','chimera','forest_spirit','vulture','titan_scorpion','leviathan','ancient_mammoth','natures_avatar','deckhand','raging_pirate','sea_robber','ship_rat','blood_corsair','sea_wolf','boarder','pirate_cook'];
const keywordNames={poisonous:'☠ Яд',windfury:'≋ Неистовые ветра',divine_shield:'✦ Божественный щит',stealth:'◌ Маскировка',reborn:'↻ Перерождение',taunt:'🛡 Провокация'};const defaultLabels={beast:'Зверь',pirate:'Пират',dragon:'Дракон',elemental:'Элементаль',custom:'Свой'};let labels=JSON.parse(localStorage.getItem('sapphire-types')||'null')||{...defaultLabels};function saveTypes(){localStorage.setItem('sapphire-types',JSON.stringify(labels))}function typeOptions(){let s=$('archetype');s.innerHTML=Object.entries(labels).map(([key,name])=>`<option value="${esc(key)}">${esc(name)}</option>`).join('')}typeOptions();
const base=[['Альфа-волк','beast',1,2,2,'Боевой клич: дайте всем зверям +1/+0 (на этот бой).','alpha_wolf'],['Арктическая Лиса','beast',1,1,3,'Боевой раж: +1 здоровья навсегда.','arctic_fox'],['Кровавая Гиена','beast',2,3,2,'Боевой раж: если убивает цель — дайте этому существу +1/+1 навсегда.','blood_hyena'],['Пещерная Жаба','beast',2,2,4,'Провокация.','cave_toad'],['Горилла','beast',4,4,4,'Боевой клич: дайте случайному зверю +2/+2 навсегда.','gorilla'],['Паук-Ловушка','beast',4,4,3,'Предсмертный хрип: призовите трёх Пауков 2/2.','trapdoor_spider'],['Матрос палубы','pirate',1,2,2,'Боевой клич: дайте другому Пирату +1 атаки.','deckhand'],['Кровавый корсар','pirate',3,4,3,'После атаки получите 1 золото.','blood_corsair']].map((x,i)=>({id:'card-'+i,name:x[0],archetype:x[1],tier:x[2],attack:x[3],health:x[4],text:x[5],keywords:[],asset:x[6],custom:false}));
let cards=JSON.parse(localStorage.getItem('sapphire-cards')||'null')||base;let selected=cards[0]?.id;let filter='all';
const $=id=>document.getElementById(id);function imgPath(c){return c.image|| (c.asset?`../archive/legacy-assets/${c.archetype==='pirate'?'pirats':'beasts'}/${c.asset}.png`:'')}
function renderList(){let q=$('search').value.toLowerCase();let shown=cards.filter(c=>(filter==='all'||c.archetype===filter)&&c.name.toLowerCase().includes(q));$('count').textContent=`${shown.length} карт`;$('cardList').innerHTML=shown.map(c=>`<button class="list-card ${c.id===selected?'active':''}" data-id="${c.id}"><img class="thumb" src="${imgPath(c)}" onerror="this.style.display='none'" alt=""><span><strong>${esc(c.name)}</strong><small>${labels[c.archetype]||c.archetype} · тир ${c.tier}</small></span><span class="tier-dot">${c.tier}</span></button>`).join('')||'<p class="hint">Ничего не найдено</p>';document.querySelectorAll('.list-card').forEach(b=>b.onclick=()=>{selected=b.dataset.id;loadForm();renderList()})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function current(){return cards.find(c=>c.id===selected)}function loadForm(){let c=current();if(!c)return;typeOptions();['name','archetype','tier','attack','health','text'].forEach(k=>$(k).value=c[k]??'');$('keywords').value=(c.keywords||[]).filter(k=>!document.querySelector(`#keywordGrid input[value="${k}"]`)).join(', ');document.querySelectorAll('#keywordGrid input').forEach(box=>box.checked=(c.keywords||[]).includes(box.value));$('workspaceTitle').textContent=c.name;renderPreview()}function syncFormPreview(){let c=current();if(!c)return;Object.assign(c,{name:$('name').value.trim()||'Безымянное существо',archetype:$('archetype').value,tier:+$('tier').value||1,attack:+$('attack').value||0,health:+$('health').value||1,text:$('text').value.trim(),keywords:[...document.querySelectorAll('#keywordGrid input:checked')].map(x=>x.value).concat($('keywords').value.split(',').map(x=>x.trim()).filter(Boolean))});$('workspaceTitle').textContent=c.name;renderPreview();renderList();localStorage.setItem('sapphire-cards',JSON.stringify(cards))}
function renderPreview(){let c=current();if(!c)return;let path=imgPath(c);$('preview').innerHTML=`${path?`<img src="${path}" onerror="this.outerHTML='<div class=art-fallback>✦</div>'" alt="">`:'<div class="art-fallback">✦</div>'}<div class="card-overlay"><span class="tier-badge">Тир ${c.tier}</span><span class="rarity">${labels[c.archetype]||c.archetype}</span></div><div class="card-body"><h3>${esc(c.name)}</h3><div class="stats"><span class="stat attack">⚔ ${c.attack}</span><span class="stat health">♥ ${c.health}</span></div><p>${esc(c.text)||'Без способности'}</p><div class="tags">${(c.keywords||[]).map(k=>`<span class="ability-badge ${esc(k)}">${keywordNames[k]||esc(k)}</span>`).join('')}</div></div>`}
function persist(){localStorage.setItem('sapphire-cards',JSON.stringify(cards));renderList();renderPreview()}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
$('form').onsubmit=e=>{e.preventDefault();syncFormPreview();persist();toast('Изменения сохранены')};$('newBtn').onclick=()=>{let id='card-'+Date.now();cards.unshift({id,name:'Новое существо',archetype:'custom',tier:1,attack:1,health:1,text:'',keywords:[],custom:true});selected=id;persist();loadForm();toast('Создана новая карта')};$('duplicateBtn').onclick=()=>{let c=current(),copy={...c,id:'card-'+Date.now(),name:c.name+' — копия',keywords:[...(c.keywords||[])]};cards.unshift(copy);selected=copy.id;persist();loadForm();toast('Карта дублирована')};$('deleteBtn').onclick=()=>{if(cards.length<2)return toast('Нельзя удалить последнюю карту');cards=cards.filter(c=>c.id!==selected);selected=cards[0].id;persist();loadForm();toast('Карта удалена')};$('search').oninput=renderList;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderList()});
document.querySelectorAll('#form input:not(#imageFile),#form textarea,#form select').forEach(el=>el.addEventListener('input',syncFormPreview));document.querySelectorAll('#keywordGrid input').forEach(el=>el.addEventListener('change',syncFormPreview));$('addType').onclick=()=>{let name=$('newType').value.trim();if(!name)return toast('Введите название типа');let key=name.toLowerCase().replace(/[^a-zа-я0-9]+/gi,'_').replace(/^_|_$/g,'')||'type_'+Date.now();if(labels[key])return toast('Такой тип уже есть');labels[key]=name;saveTypes();typeOptions();$('archetype').value=key;$('newType').value='';syncFormPreview();toast(`Тип «${name}» добавлен`)};$('imageFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{current().image=r.result;current().asset='';renderPreview();toast('Изображение загружено')};r.readAsDataURL(f)};$('clearImage').onclick=()=>{delete current().image;current().asset='';renderPreview()};assets.forEach(a=>{let o=document.createElement('option');o.value=a;o.textContent=a.replaceAll('_',' ');$('assetSelect').append(o)});$('assetSelect').onchange=e=>{if(e.target.value){current().asset=e.target.value;delete current().image;renderPreview()}};
$('exportBtn').onclick=()=>{let out={version:1,updatedAt:new Date().toISOString(),cards};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='sapphire-cards.json';a.click();toast('JSON выгружен')};$('importBtn').onclick=()=>$('jsonFile').click();$('jsonFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);let incoming=Array.isArray(d)?d:(d.cards||flatten(d));cards=incoming.map((c,i)=>({...c,id:c.id||'imported-'+i, name:c.name||c.name_ru||'Безымянное',archetype:c.archetype||'custom',tier:+c.tier||1,attack:+c.attack||0,health:+c.health||1,keywords:c.keywords||[],asset:c.asset||assetFromFile(c.file)}));selected=cards[0]?.id;persist();loadForm();toast(`Импортировано: ${cards.length}`)}catch(err){toast('Не удалось прочитать JSON')}};r.readAsText(f)};
function assetFromFile(f){return f?f.split('/').pop().replace(/\.png$/,''):''}function flatten(d){let out=[];if(d?.tiers){let arch=d.archetype||'custom';Object.entries(d.tiers).forEach(([tier,list])=>list.forEach(c=>out.push({...c,archetype:arch,tier})));(d.unplaced||[]).forEach(c=>out.push({...c,archetype:arch,tier:1}));return out}Object.entries(d||{}).forEach(([arch,v])=>{if(v?.tiers)Object.entries(v.tiers).forEach(([tier,list])=>list.forEach(c=>out.push({...c,archetype:arch,tier})));if(Array.isArray(v?.unplaced))v.unplaced.forEach(c=>out.push({...c,archetype:arch,tier:1}))});return out}renderList();loadForm();
</script></body></html>
